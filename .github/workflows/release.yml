name: Release and Publish Windows App

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# Never publish two releases at the same time; a newer push cancels the older build
concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Auto-bump version: MAJOR.MINOR.(PATCH + run_number) so every push to main
      # produces a strictly higher version that electron-updater will pick up.
      - name: Compute Release Version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          VERSION="$MAJOR.$MINOR.$((PATCH + GITHUB_RUN_NUMBER))"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Release version: $VERSION"

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Copy Assets for Electron
        run: npm run build:copy-assets

      - name: Build & Publish Electron Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder build --win --publish always
