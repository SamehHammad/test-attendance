<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام الحضور والانصراف</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 60%, #4c1d95 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
      user-select: none;
      overflow: hidden;
    }
    .logo {
      font-size: 72px;
      margin-bottom: 18px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .version {
      font-size: 12px;
      opacity: 0.5;
      margin-bottom: 36px;
    }
    .progress-bar {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #818cf8, #c4b5fd);
      border-radius: 4px;
      animation: progress 90s linear forwards;
    }
    @keyframes progress { to { width: 95%; } }
    #status {
      font-size: 13px;
      opacity: 0.65;
      min-height: 20px;
      transition: opacity 0.3s;
    }
    .dots {
      display: inline-block;
      animation: dots 1.4s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
    .dots::after {
      content: '';
      animation: dotsText 1.4s steps(3, end) infinite;
    }
    @keyframes dotsText {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="logo"><img src="logo.png" style="width: 120px; height: 120px; object-fit: contain;" alt="Logo" /></div>
  <h1>نظام الحضور والانصراف</h1>
  <div class="version">الإصدار 1.0</div>
  <div class="progress-bar"><div class="progress-fill"></div></div>
  <div id="status">جاري تهيئة التطبيق<span class="dots"></span></div>
</body>
</html>
